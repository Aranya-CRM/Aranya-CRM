name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-guard:
    name: Secret guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure secret-like files are not tracked
        shell: bash
        run: |
          set -euo pipefail

          tracked_files="$(
            git ls-files |
              grep -Ei '(^|/)(\.env($|\.(local|development|test|production|staging)$)|.*service-account.*\.json|.*serviceAccount.*\.json|.*google-application-credentials.*\.json|.*\.pem|.*\.key|.*\.p8|.*\.p12|.*\.jks|.*\.keystore)$' || true
          )"

          if [ -n "$tracked_files" ]; then
            echo "Secret-like files are tracked by git:"
            echo "$tracked_files"
            exit 1
          fi

      - name: Scan tracked files for common private key/token patterns
        shell: bash
        run: |
          set -euo pipefail

          dash='-----'
          private_key_pattern="${dash}BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY${dash}"
          token_pattern="AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|ghp_[0-9A-Za-z_]{36,}|xox[baprs]-[0-9A-Za-z-]+"

          if git grep -n -I -E \
            "${private_key_pattern}|${token_pattern}" \
            -- . ':!frontend/package-lock.json'
          then
            echo "Potential secret pattern found in tracked files."
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Package
        run: mvn -B package -Dmaven.test.skip=true

  deploy-vm:
    name: Deploy VM
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs:
      - secret-guard
      - frontend
      - backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: aranya-crm-dev
      REGION: asia-southeast1
      ZONE: asia-southeast1-b
      REPOSITORY: aranya-crm
      VM_NAME: aranya-crm-dev-vm
      WIF_PROVIDER: projects/746649380908/locations/global/workloadIdentityPools/github-actions/providers/aranya-crm
      DEPLOY_SERVICE_ACCOUNT: aranya-github-deployer@aranya-crm-dev.iam.gserviceaccount.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push images
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          set -euo pipefail
          for variable_name in \
            VITE_FIREBASE_API_KEY \
            VITE_FIREBASE_AUTH_DOMAIN \
            VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_APP_ID; do
            if [ -z "${!variable_name}" ]; then
              echo "Missing GitHub Actions variable: ${variable_name}" >&2
              exit 1
            fi
          done

          image_tag="${GITHUB_SHA::12}"
          backend_image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/backend:${image_tag}"
          frontend_image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/frontend:${image_tag}"

          docker build \
            -t "${backend_image}" \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/backend:latest" \
            backend

          docker build \
            -t "${frontend_image}" \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/frontend:latest" \
            --build-arg "VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}" \
            --build-arg "VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}" \
            --build-arg "VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}" \
            --build-arg "VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}" \
            --build-arg "VITE_GOOGLE_OAUTH_CLIENT_ID=${VITE_GOOGLE_OAUTH_CLIENT_ID}" \
            --build-arg "VITE_API_BASE_URL=" \
            frontend

          docker push --all-tags "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/backend"
          docker push --all-tags "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/frontend"

          echo "BACKEND_IMAGE=${backend_image}" >> "${GITHUB_ENV}"
          echo "FRONTEND_IMAGE=${frontend_image}" >> "${GITHUB_ENV}"

      - name: Deploy to VM
        run: |
          gcloud compute ssh "${VM_NAME}" \
            --project="${PROJECT_ID}" \
            --zone="${ZONE}" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo /usr/local/sbin/aranya-deploy '${BACKEND_IMAGE}' '${FRONTEND_IMAGE}'"

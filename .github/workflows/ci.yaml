name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-guard:
    name: Secret guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure secret-like files are not tracked
        shell: bash
        run: |
          set -euo pipefail

          tracked_files="$(
            git ls-files |
              grep -Ei '(^|/)(\.env($|\.(local|development|test|production|staging)$)|.*service-account.*\.json|.*serviceAccount.*\.json|.*google-application-credentials.*\.json|.*\.pem|.*\.key|.*\.p8|.*\.p12|.*\.jks|.*\.keystore)$' || true
          )"

          if [ -n "$tracked_files" ]; then
            echo "Secret-like files are tracked by git:"
            echo "$tracked_files"
            exit 1
          fi

      - name: Scan tracked files for common private key/token patterns
        shell: bash
        run: |
          set -euo pipefail

          dash='-----'
          private_key_pattern="${dash}BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY${dash}"
          token_pattern="AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|ghp_[0-9A-Za-z_]{36,}|xox[baprs]-[0-9A-Za-z-]+"

          if git grep -n -I -E \
            "${private_key_pattern}|${token_pattern}" \
            -- . ':!frontend/package-lock.json'
          then
            echo "Potential secret pattern found in tracked files."
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Package
        run: mvn -B package -Dmaven.test.skip=true

databaseChangeLog:
  - changeSet:
      id: 039-clear-dev-client-case-report-data
      author: codex
      context: test
      comment: "TEST-only: clear sample client/case/report data so integration tests start empty. Excluded from dev (devs keep seed data) and prod."
      changes:
        - sql:
            splitStatements: false
            sql: |
              DELETE FROM visit_report;
              DELETE FROM case_note;
              DELETE FROM case_assignment;
              DELETE FROM case_change_log;
              DELETE FROM service_appointment;
              DELETE FROM case_document;
              DELETE FROM "case";
              DELETE FROM related_contact;
              DELETE FROM client;

      rollback:
        - sql:
            sql: SELECT 1;

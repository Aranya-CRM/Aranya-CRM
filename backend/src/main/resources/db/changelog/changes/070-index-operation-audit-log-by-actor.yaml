databaseChangeLog:
  - changeSet:
      id: 070-index-operation-audit-log-by-actor
      author: codex
      changes:
        - createIndex:
            tableName: operation_audit_log
            indexName: idx_operation_audit_log_case_actor_time
            columns:
              - column:
                  name: case_id
              - column:
                  name: actor_id
              - column:
                  name: occurred_at
      rollback:
        - dropIndex:
            tableName: operation_audit_log
            indexName: idx_operation_audit_log_case_actor_time

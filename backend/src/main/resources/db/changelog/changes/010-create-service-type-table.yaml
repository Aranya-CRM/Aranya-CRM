databaseChangeLog:
  - changeSet:
      id: 010
      author: ShiDu
      changes:
        - createTable:
            tableName: service_type
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_service_type_category
                    references: service_category(id)
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_service_type_created_by
                    references: users(id)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: service_type
            columnNames: category_id, name
            constraintName: uq_service_type_category_name
        - createIndex:
            indexName: idx_service_type_category_id
            tableName: service_type
            columns:
              - column:
                  name: category_id
      rollback:
        - dropTable:
            tableName: service_type

databaseChangeLog:
  - changeSet:
      id: 013
      author: ShiDu
      changes:
        - createTable:
            tableName: service_appointment
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: case_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_service_appointment_case
                    references: case(id)
              - column:
                  name: service_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: scheduled_start
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: scheduled_end
                  type: TIMESTAMP
              - column:
                  name: location
                  type: VARCHAR(255)
              - column:
                  name: assigned_user_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_service_appointment_user
                    references: users(id)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: SCHEDULED
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_service_appointment_created_by
                    references: users(id)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
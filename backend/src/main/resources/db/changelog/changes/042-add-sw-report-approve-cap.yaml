databaseChangeLog:
  - changeSet:
      id: 042-add-sw-report-approve-cap
      author: ShiDu
      comment: "Grant reports:approve_archive to SOCIAL_WORKER so SWs can approve submitted volunteer reports"
      changes:
        - sql:
            sql: |
              INSERT INTO role_cap (role_id, cap_def_id, scope_value)
              SELECT r.id, cd.id, 'WORKFLOW'
              FROM role r, cap_definition cd
              WHERE r.name = 'SOCIAL_WORKER'
                AND cd.cap_key = 'reports:approve_archive'
              ON CONFLICT (role_id, cap_def_id) DO NOTHING;

databaseChangeLog:
  - changeSet:
      id: 001
      author: ShiDu
      comment: "Create role table - stores system roles for RBAC"
      changes:
        - createTable:
            tableName: role
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)
      rollback:
        - dropTable:
            tableName: role
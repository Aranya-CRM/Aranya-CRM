databaseChangeLog:
  - changeSet:
      id: 031-1-add-convert-to-case-permission
      author: ShiDu
      comment: "Add clients.convert_to_case feature permission"
      changes:
        - sql:
            sql: >
              INSERT INTO permission (code, type, description) VALUES
                ('clients.convert_to_case', 'FEATURE', 'Convert a client profile into a case client')
              ON CONFLICT (code, type) DO NOTHING;

  - changeSet:
      id: 031-2-revoke-social-worker-full-profile
      author: ShiDu
      comment: "Remove clients.view.full from SOCIAL_WORKER — they should see basic profile only"
      changes:
        - sql:
            sql: >
              DELETE FROM role_permission rp
              USING role r, permission p
              WHERE rp.role_id = r.id
                AND rp.permission_id = p.id
                AND r.name = 'SOCIAL_WORKER'
                AND p.code = 'clients.view.full'
                AND p.type = 'FEATURE';

  - changeSet:
      id: 031-3-grant-social-worker-convert-to-case
      author: ShiDu
      comment: "Grant SOCIAL_WORKER the clients.convert_to_case permission"
      changes:
        - sql:
            sql: >
              INSERT INTO role_permission (role_id, permission_id)
              SELECT r.id, p.id
              FROM role r
              JOIN permission p ON p.code = 'clients.convert_to_case' AND p.type = 'FEATURE'
              WHERE r.name = 'SOCIAL_WORKER'
              ON CONFLICT (role_id, permission_id) DO NOTHING;

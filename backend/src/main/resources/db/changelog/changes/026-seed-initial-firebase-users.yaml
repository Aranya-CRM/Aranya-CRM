databaseChangeLog:
  - changeSet:
      id: 026-seed-initial-firebase-users
      author: Codex
      context: dev, test
      comment: "Seed initial Firebase-linked DEV/TEST users (admin + test accounts, dev Firebase UIDs). Excluded from prod — seed the real prod admin separately."
      changes:
        - sql:
            sql: >
              INSERT INTO users (firebase_uid, username, full_name, email, email_verified, status)
              VALUES
                (
                  'e1d6ofsq0sdoku7FUDqHlWMxTm93',
                  'aranya_crm_admin',
                  'Aranya CRM',
                  'aranya.crm.admin@gmail.com',
                  true,
                  'ACTIVE'
                ),
                (
                  'jMcy4wdmJVVY5VQlSv2QZ1rAIhg1',
                  'volunteer',
                  'Volunteer User',
                  'volunteer@test.com',
                  true,
                  'ACTIVE'
                ),
                (
                  'l4jsMBVfeehmserQ70itLXei9bA2',
                  'social_worker',
                  'Social Worker User',
                  'socialworker@test.com',
                  true,
                  'ACTIVE'
                )
              ON CONFLICT (email) DO UPDATE SET
                firebase_uid = EXCLUDED.firebase_uid,
                username = EXCLUDED.username,
                full_name = EXCLUDED.full_name,
                email_verified = EXCLUDED.email_verified,
                status = EXCLUDED.status,
                updated_at = NOW();

        - sql:
            sql: >
              INSERT INTO user_role (user_id, role_id, assigned_at, assigned_by)
              SELECT u.id, r.id, NOW(), NULL
              FROM users u
              JOIN role r ON
                (u.email = 'aranya.crm.admin@gmail.com' AND r.name = 'MANAGER')
                OR (u.email = 'volunteer@test.com' AND r.name = 'VOLUNTEER')
                OR (u.email = 'socialworker@test.com' AND r.name = 'SOCIAL_WORKER')
              WHERE u.email IN (
                'aranya.crm.admin@gmail.com',
                'volunteer@test.com',
                'socialworker@test.com'
              )
              ON CONFLICT (user_id, role_id) DO NOTHING;

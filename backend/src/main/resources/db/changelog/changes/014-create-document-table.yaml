databaseChangeLog:
  - changeSet:
      id: 014-create-document-table
      author: ShiDu
      changes:
        - createTable:
            tableName: document
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: store_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: s3_bucket
                  type: VARCHAR(255)
              - column:
                  name: s3_key
                  type: VARCHAR(500)
              - column:
                  name: mime_type
                  type: VARCHAR(100)
              - column:
                  name: file_size
                  type: BIGINT
              - column:
                  name: document_type
                  type: VARCHAR(50)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: uploaded_by
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_document_uploaded_by
                    references: users(id)
              - column:
                  name: uploaded_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: checksum
                  type: VARCHAR(255)
              - column:
                  name: updated_at
                  type: TIMESTAMP
      rollback:
        - dropTable:
            tableName: document

databaseChangeLog:
  - changeSet:
      id: 003
      author: ShiDu
      comment: "Create user_role table - maps users to roles for RBAC"
      changes:
        - createTable:
            tableName: user_role
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_role_user
                    references: users(id)
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_role_role
                    references: role(id)
              - column:
                  name: assigned_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: assigned_by
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_user_role_assigned_by
                    references: users(id)

        - addUniqueConstraint:
            tableName: user_role
            columnNames: user_id, role_id
            constraintName: uq_user_role_user_id_role_id

        - createIndex:
            indexName: idx_user_role_user_id
            tableName: user_role
            columns:
              - column:
                  name: user_id

      rollback:
        - dropTable:
            tableName: user_role
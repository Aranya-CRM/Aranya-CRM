databaseChangeLog:
  - changeSet:
      id: 006
      author: ShiDu
      comment: "Create client table - stores CRM client/beneficiary profiles"
      changes:
        - createTable:
            tableName: client
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: client_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: dharma_name
                  type: VARCHAR(100)
              - column:
                  name: identifier_no
                  type: VARCHAR(50)
              - column:
                  name: gender
                  type: VARCHAR(10)
              - column:
                  name: date_of_birth
                  type: DATE
              - column:
                  name: phone
                  type: VARCHAR(20)
              - column:
                  name: email
                  type: VARCHAR(100)
              - column:
                  name: address_text
                  type: TEXT
              - column:
                  name: temple_affiliation
                  type: VARCHAR(100)
              - column:
                  name: residential_status
                  type: VARCHAR(50)
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_client_client_code
            tableName: client
            columns:
              - column:
                  name: client_code

        - createIndex:
            indexName: idx_client_client_name
            tableName: client
            columns:
              - column:
                  name: client_name

        - createIndex:
            indexName: idx_client_identifier_no
            tableName: client
            columns:
              - column:
                  name: identifier_no

        - createIndex:
            indexName: idx_client_status
            tableName: client
            columns:
              - column:
                  name: status

        - createIndex:
            indexName: idx_client_temple_affiliation
            tableName: client
            columns:
              - column:
                  name: temple_affiliation

      rollback:
        - dropTable:
            tableName: client
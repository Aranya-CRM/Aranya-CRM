databaseChangeLog:
  - changeSet:
      id: 002-create-user-table
      author: ShiDu
      comment: "Create users table - stores system user accounts"
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: firebase_uid
                  type: VARCHAR(128)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: full_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email_verified
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(20)
#              - column:
#                  name: password_hash
#                  type: VARCHAR(255)
#                  constraints:
#                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: JAVA.SQL.Types.TIMESTAMP_WITH_TIMEZONE
                  defaultValue: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: JAVA.SQL.TYPES.TIMESTAMP_WITH_TIMEZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_user_email
            tableName: users
            columns:
              - column:
                  name: email

        - createIndex:
            indexName: idx_users_status
            tableName: users
            columns:
              - column:
                  name: status

        - createIndex:
            indexName: idx_users_username
            tableName: users
            columns:
              - column:
                  name: username

      rollback:
        - dropTable:
            tableName: users
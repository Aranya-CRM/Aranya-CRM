databaseChangeLog:
  - changeSet:
      id: 002
      author: ShiDu
      comment: "Create users table - stores system user accounts"
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: full_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: phone
                  type: VARCHAR(20)
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_user_email
            tableName: users
            columns:
              - column:
                  name: email

        - createIndex:
            indexName: idx_users_status
            tableName: users
            columns:
              - column:
                  name: status

        - createIndex:
            indexName: idx_users_username
            tableName: users
            columns:
              - column:
                  name: username

      rollback:
        - dropTable:
            tableName: users
databaseChangeLog:
  - changeSet:
      id: 069-create-operation-audit-log
      author: codex
      changes:
        - createTable:
            tableName: operation_audit_log
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: case_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_operation_audit_log_case
                    references: case(id)
              - column:
                  name: actor_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_operation_audit_log_actor
                    references: users(id)
              - column:
                  name: actor_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: target_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: target_id
                  type: VARCHAR(100)
              - column:
                  name: target_label
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: result
                  type: VARCHAR(20)
                  defaultValue: SUCCESS
                  constraints:
                    nullable: false
              - column:
                  name: summary
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: before_json
                  type: TEXT
              - column:
                  name: after_json
                  type: TEXT
              - column:
                  name: reason
                  type: TEXT
              - column:
                  name: approval_request_id
                  type: BIGINT
              - column:
                  name: source
                  type: VARCHAR(20)
                  defaultValue: WEB
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: operation_audit_log
            indexName: idx_operation_audit_log_case_time
            columns:
              - column:
                  name: case_id
              - column:
                  name: occurred_at
        - createIndex:
            tableName: operation_audit_log
            indexName: idx_operation_audit_log_target
            columns:
              - column:
                  name: target_type
              - column:
                  name: target_id
        - createIndex:
            tableName: operation_audit_log
            indexName: idx_operation_audit_log_approval
            columns:
              - column:
                  name: approval_request_id
      rollback:
        - dropTable:
            tableName: operation_audit_log


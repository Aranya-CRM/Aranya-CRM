databaseChangeLog:
  - changeSet:
      id: 005
      author: ShiDu
      changes:
        - createTable:
            tableName: email_notification_log
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: send_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_email_log_send_user
                    references: users(id)
              - column:
                  name: recipient_user_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_email_log_recipient_user
                    references: users(id)
              - column:
                  name: recipient_email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: source_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: source_id
                  type: BIGINT
              - column:
                  name: send_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
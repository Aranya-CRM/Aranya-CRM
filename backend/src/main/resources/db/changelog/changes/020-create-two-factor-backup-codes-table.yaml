databaseChangeLog:
  - changeSet:
      id: 020
      author: ShiDu
      changes:
        - createTable:
            tableName: two_factor_backup_code
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_backup_code_user
                    references: users(id)
              - column:
                  name: code_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: used
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: two_factor_backup_code
            indexName: idx_backup_code_user_id
            columns:
              - column:
                  name: user_id
      rollback:
        - dropTable:
            tableName: two_factor_backup_code

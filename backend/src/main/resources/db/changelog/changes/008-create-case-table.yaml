databaseChangeLog:
  - changeSet:
      id: 008-create-case-table
      author: ShiDu
      changes:
        - createTable:
            tableName: case
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: case_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: client_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_case_client
                    references: client(id)
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: priority
                  type: VARCHAR(20)
                  defaultValue: NORMAL
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: OPEN
                  constraints:
                    nullable: false
              - column:
                  name: color_code
                  type: VARCHAR(20)
              - column:
                  name: tradition
                  type: VARCHAR(30)
              - column:
                  name: opened_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: closed_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_case_created_by
                    references: users(id)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: comments
                  type: TEXT
              - column:
                  name: remarks
                  type: TEXT
        - createIndex:
            indexName: idx_case_client_id
            tableName: case
            columns:
              - column:
                  name: client_id
        - createIndex:
            indexName: idx_case_color_code
            tableName: case
            columns:
              - column:
                  name: color_code
        - createIndex:
            indexName: idx_case_tradition
            tableName: case
            columns:
              - column:
                  name: tradition
      rollback:
        - dropTable:
            tableName: case

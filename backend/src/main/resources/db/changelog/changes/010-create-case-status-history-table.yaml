databaseChangeLog:
  - changeSet:
      id: 010
      author: ShiDu
      changes:
        - createTable:
            tableName: case_status_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: case_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_case_status_history_case
                    references: case(id)
              - column:
                  name: old_status
                  type: VARCHAR(20)
              - column:
                  name: new_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: changed_by
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_case_status_history_user
                    references: user(id)
              - column:
                  name: changed_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: remarks
                  type: TEXT
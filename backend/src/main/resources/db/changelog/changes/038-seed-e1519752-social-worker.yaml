databaseChangeLog:
  - changeSet:
      id: 038-seed-e1519752-social-worker
      author: Codex
      context: dev
      comment: "Seed Firebase-linked social worker user e1519752@u.nus.edu"
      changes:
        - sql:
            splitStatements: false
            sql: |
              DO $$
              DECLARE
                target_user_id BIGINT;
                target_role_id BIGINT;
              BEGIN
                SELECT id
                INTO target_user_id
                FROM users
                WHERE firebase_uid = 'eHdQ6mGqvJhAcJb8X3QZf7CqHJb2'
                   OR email = 'e1519752@u.nus.edu'
                ORDER BY
                  CASE
                    WHEN firebase_uid = 'eHdQ6mGqvJhAcJb8X3QZf7CqHJb2' THEN 0
                    ELSE 1
                  END
                LIMIT 1;

                IF target_user_id IS NULL THEN
                  INSERT INTO users (
                    firebase_uid,
                    username,
                    full_name,
                    email,
                    email_verified,
                    status
                  )
                  VALUES (
                    'eHdQ6mGqvJhAcJb8X3QZf7CqHJb2',
                    'e1519752',
                    'e1519752@u.nus.edu',
                    'e1519752@u.nus.edu',
                    true,
                    'ACTIVE'
                  )
                  RETURNING id INTO target_user_id;
                ELSE
                  UPDATE users
                  SET
                    firebase_uid = 'eHdQ6mGqvJhAcJb8X3QZf7CqHJb2',
                    email = 'e1519752@u.nus.edu',
                    full_name = COALESCE(NULLIF(full_name, ''), 'e1519752@u.nus.edu'),
                    email_verified = true,
                    status = 'ACTIVE',
                    updated_at = NOW()
                  WHERE id = target_user_id;
                END IF;

                SELECT id
                INTO target_role_id
                FROM role
                WHERE name = 'SOCIAL_WORKER';

                DELETE FROM user_role
                WHERE user_id = target_user_id
                  AND role_id <> target_role_id;

                INSERT INTO user_role (user_id, role_id, assigned_at, assigned_by)
                VALUES (target_user_id, target_role_id, NOW(), NULL)
                ON CONFLICT (user_id, role_id) DO NOTHING;
              END $$;

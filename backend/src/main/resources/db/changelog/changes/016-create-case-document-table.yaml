databaseChangeLog:
  - changeSet:
      id: 016
      author: ShiDu
      changes:
        - createTable:
            tableName: case_document
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: case_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_case_document_case
                    references: case(id)
              - column:
                  name: document_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_case_document_document
                    references: document(id)
              - column:
                  name: linked_by
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_case_document_linked_by
                    references: user(id)
              - column:
                  name: linked_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
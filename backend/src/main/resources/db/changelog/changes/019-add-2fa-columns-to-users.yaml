databaseChangeLog:
  - changeSet:
      id: 019
      author: ShiDu
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: two_factor_enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: two_factor_secret
                  type: VARCHAR(512)
      rollback:
        - dropColumn:
            tableName: users
            columnName: two_factor_enabled
        - dropColumn:
            tableName: users
            columnName: two_factor_secret

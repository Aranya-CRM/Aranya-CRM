databaseChangeLog:
  - changeSet:
      id: 011
      author: ShiDu
      changes:
        - createTable:
            tableName: case_assignment
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: case_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_case_assignment_case
                    references: case(id)
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_case_assignment_user
                    references: users(id)
              - column:
                  name: assignment_role
                  type: VARCHAR(50)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: assigned_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: end_at
                  type: TIMESTAMP
              - column:
                  name: assigned_by
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_case_assignment_assigned_by
                    references: users(id)
      rollback:
        - dropTable:
            tableName: case_assignment
databaseChangeLog:
  - changeSet:
      id: 015-create-case-change-log-table
      author: ShiDu
      changes:
        - createTable:
            tableName: case_change_log
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: case_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_case_change_log_case
                    references: case(id)
              - column:
                  name: field_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: old_value
                  type: TEXT
              - column:
                  name: new_value
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: changed_by
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_case_change_log_changed_by
                    references: users(id)
              - column:
                  name: changed_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: remarks
                  type: TEXT
        - createIndex:
            indexName: idx_case_change_log_case_id
            tableName: case_change_log
            columns:
              - column:
                  name: case_id
      rollback:
        - dropTable:
            tableName: case_change_log

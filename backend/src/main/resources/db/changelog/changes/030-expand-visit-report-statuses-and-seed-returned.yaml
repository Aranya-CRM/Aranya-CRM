databaseChangeLog:
  - changeSet:
      id: 030-expand-visit-report-statuses-and-seed-returned
      author: codex
      context: dev, test
      changes:
        - sql:
            splitStatements: false
            sql: |
              UPDATE visit_report
              SET status = 'ARCHIVED'
              WHERE status = 'SUBMITTED';

              INSERT INTO visit_report (
                client_id,
                created_by,
                staff_name,
                report_timestamp,
                date_of_visit,
                time_of_visit,
                duration_of_visit,
                location,
                programme_name,
                type_of_visit,
                purpose_of_visit,
                what_was_done,
                environment_observations,
                sangha_observations,
                other_observations,
                personal_reflections,
                recommendations,
                matters_to_highlight,
                status,
                created_at,
                updated_at
              )
              SELECT
                c.id,
                u.id,
                u.full_name,
                TIMESTAMP '2026-05-18 09:20:00',
                DATE '2026-05-18',
                '09:20',
                '45 minutes',
                'Vihara',
                'Returned report mock',
                'Befriending',
                'Follow-up after recent health concerns.',
                'Checked daily routine and meal arrangement.',
                'Room was generally clean; fan switch needs attention.',
                'Client was tired and asked for shorter visits.',
                'Manager requested clearer follow-up details before archiving.',
                'Need to keep observations concise and specific.',
                'Add exact next follow-up date and contact person.',
                'Returned by manager for more detail.',
                'RETURNED',
                TIMESTAMP '2026-05-18 09:25:00',
                TIMESTAMP '2026-05-20 14:10:00'
              FROM users u
              JOIN client c ON c.id = 9
              WHERE u.firebase_uid = '5RJDJbsgdgcF2RH8XQ3tJGbXDFz1'
                AND NOT EXISTS (
                  SELECT 1 FROM visit_report vr
                  WHERE vr.created_by = u.id
                    AND vr.client_id = c.id
                    AND vr.date_of_visit = DATE '2026-05-18'
                    AND vr.status = 'RETURNED'
                );

              INSERT INTO visit_report (
                client_id,
                created_by,
                staff_name,
                report_timestamp,
                date_of_visit,
                time_of_visit,
                duration_of_visit,
                location,
                programme_name,
                type_of_visit,
                purpose_of_visit,
                what_was_done,
                environment_observations,
                sangha_observations,
                other_observations,
                personal_reflections,
                recommendations,
                matters_to_highlight,
                status,
                created_at,
                updated_at
              )
              SELECT
                c.id,
                u.id,
                u.full_name,
                TIMESTAMP '2026-05-21 15:00:00',
                DATE '2026-05-21',
                '15:00',
                '1 hour',
                'Bright Hill Temple',
                'Returned care planning mock',
                'Care Planning',
                'Clarify care preferences and next visit plan.',
                'Discussed daily needs and possible support schedule.',
                'No hazards observed in the room.',
                'Client asked to revisit the plan after speaking with temple contact.',
                'Returned because recommendations were too general.',
                'Ask clearer questions before writing recommendations.',
                'Specify who should follow up and by when.',
                'Returned by manager; volunteer needs to revise and resubmit.',
                'RETURNED',
                TIMESTAMP '2026-05-21 15:08:00',
                TIMESTAMP '2026-05-22 10:15:00'
              FROM users u
              JOIN client c ON c.id = 10
              WHERE u.firebase_uid = '5RJDJbsgdgcF2RH8XQ3tJGbXDFz1'
                AND NOT EXISTS (
                  SELECT 1 FROM visit_report vr
                  WHERE vr.created_by = u.id
                    AND vr.client_id = c.id
                    AND vr.date_of_visit = DATE '2026-05-21'
                    AND vr.status = 'RETURNED'
                );

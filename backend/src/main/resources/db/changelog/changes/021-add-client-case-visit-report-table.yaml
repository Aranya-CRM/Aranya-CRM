databaseChangeLog:
  - changeSet:
      id: 021
      author: ShiDu
      comment: "Add missing client and case fields, and create visit_report table"
      changes:
        - addColumn:
            tableName: client
            columns:
              - column:
                  name: next_of_kin_contact
                  type: VARCHAR(100)
        - addColumn:
            tableName: case
            columns:
              - column:
                  name: client_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_case_client
                    references: client(id)
              - column:
                  name: tradition
                  type: VARCHAR(30)
              - column:
                  name: color_code
                  type: VARCHAR(20)
              - column:
                  name: social_worker_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_case_social_worker
                    references: users(id)
              - column:
                  name: comments
                  type: TEXT
              - column:
                  name: remarks
                  type: TEXT
        - createTable:
            tableName: visit_report
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_visit_report_client
                    references: client(id)
              - column:
                  name: created_by
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_visit_report_created_by
                    references: users(id)
              - column:
                  name: staff_name
                  type: VARCHAR(150)
              - column:
                  name: report_timestamp
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_of_visit
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: time_of_visit
                  type: VARCHAR(20)
              - column:
                  name: duration_of_visit
                  type: VARCHAR(50)
              - column:
                  name: location
                  type: VARCHAR(255)
              - column:
                  name: programme_name
                  type: VARCHAR(255)
              - column:
                  name: type_of_visit
                  type: VARCHAR(100)
              - column:
                  name: purpose_of_visit
                  type: TEXT
              - column:
                  name: what_was_done
                  type: TEXT
              - column:
                  name: environment_observations
                  type: TEXT
              - column:
                  name: sangha_observations
                  type: TEXT
              - column:
                  name: other_observations
                  type: TEXT
              - column:
                  name: personal_reflections
                  type: TEXT
              - column:
                  name: recommendations
                  type: TEXT
              - column:
                  name: matters_to_highlight
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - createIndex:
            indexName: idx_case_client_id
            tableName: case
            columns:
              - column:
                  name: client_id
        - createIndex:
            indexName: idx_case_color_code
            tableName: case
            columns:
              - column:
                  name: color_code
        - createIndex:
            indexName: idx_case_tradition
            tableName: case
            columns:
              - column:
                  name: tradition
        - createIndex:
            indexName: idx_case_social_worker_id
            tableName: case
            columns:
              - column:
                  name: social_worker_id
        - createIndex:
            indexName: idx_visit_report_client_id
            tableName: visit_report
            columns:
              - column:
                  name: client_id
        - createIndex:
            indexName: idx_visit_report_created_by
            tableName: visit_report
            columns:
              - column:
                  name: created_by
      rollback:
        - dropTable:
            tableName: visit_report
        - dropColumn:
            tableName: case
            columns:
              - column:
                  name: client_id
              - column:
                  name: tradition
              - column:
                  name: color_code
              - column:
                  name: social_worker_id
              - column:
                  name: comments
              - column:
                  name: remarks
        - dropColumn:
            tableName: client
            columns:
              - column:
                  name: next_of_kin_contact

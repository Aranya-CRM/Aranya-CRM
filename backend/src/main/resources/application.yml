app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1800000
    refresh-token-expiration: 604800000
  two-factor:
    issuer: AranyaCRM
    temp-token-expiration: 300000
    encryption-key: ${TWO_FACTOR_ENCRYPTION_KEY}


spring:
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_URL:http://localhost:9090}
        instance:
          name: aranya-crm-backend

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account-dev.json}
  project-id: ${FIREBASE_PROJECT_ID:aranya-crm-dev}

google:
  calendar:
    enabled: ${GOOGLE_CALENDAR_ENABLED:false}
    service-account-path: ${GOOGLE_CALENDAR_SA_PATH:classpath:google-calendar-sa-dev.json}
    calendar-id: ${GOOGLE_CALENDAR_ID:}
    time-zone: ${GOOGLE_CALENDAR_TZ:Asia/Singapore}
    # 留空=SA 直连(需共享日历给 SA);填 Workspace 用户邮箱=域级委派模拟该用户
    impersonated-user: ${GOOGLE_CALENDAR_IMPERSONATE:}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1800000
    refresh-token-expiration: 604800000
  two-factor:
    issuer: AranyaCRM
    temp-token-expiration: 300000
    encryption-key: ${TWO_FACTOR_ENCRYPTION_KEY}


spring:
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:25MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:25MB}

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_URL:http://localhost:9090}
        instance:
          name: aranya-crm-backend

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account-dev.json}
  project-id: ${FIREBASE_PROJECT_ID:aranya-crm-dev}

google:
  calendar:
    enabled: ${GOOGLE_CALENDAR_ENABLED:false}
    # SERVICE_ACCOUNT 或 OAUTH
    auth-mode: ${GOOGLE_CALENDAR_AUTH_MODE:SERVICE_ACCOUNT}
    # 单日历(向后兼容);多日历用 list
    calendar-id: ${GOOGLE_CALENDAR_ID:}
    # 多日历:"id1|名称1;id2|名称2"(; 分隔条目,| 分隔 id 与显示名)
    list: ${GOOGLE_CALENDAR_LIST:}
    # 默认写入日历 id(留空取 list 第一项)
    default-id: ${GOOGLE_CALENDAR_DEFAULT_ID:}
    time-zone: ${GOOGLE_CALENDAR_TZ:Asia/Singapore}
    # ── SERVICE_ACCOUNT 模式 ──
    service-account-path: ${GOOGLE_CALENDAR_SA_PATH:classpath:google-calendar-sa-dev.json}
    # 留空=SA 直连(需共享日历给 SA);填 Workspace 用户邮箱=域级委派模拟该用户
    impersonated-user: ${GOOGLE_CALENDAR_IMPERSONATE:}
    # ── OAUTH 模式(后端持有单一账号 refresh token,如 infotech@aranya.sg) ──
    oauth-client-id: ${GOOGLE_CALENDAR_OAUTH_CLIENT_ID:}
    oauth-client-secret: ${GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET:}
    oauth-refresh-token: ${GOOGLE_CALENDAR_OAUTH_REFRESH_TOKEN:}
  # Drive 导入(一次性历史文件迁移):复用上面 calendar 的 OAuth 凭据(infotech,
  # refresh token 需同时含 drive.readonly scope)。enabled=false 时导入功能停用。
  drive:
    enabled: ${GOOGLE_DRIVE_ENABLED:false}
    root-folder-id: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:}

storage:
  max-upload-size-mb: ${FILE_STORAGE_MAX_UPLOAD_SIZE_MB:25}
  gcs:
    bucket-name: ${GCS_BUCKET_NAME:}
    signed-url-ttl-minutes: ${GCS_SIGNED_URL_TTL_MINUTES:10}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

server:
  port: ${PORT:8080}

app:
  two-factor:
    # Base64 of "AranyaCRM2FADevKeyForTesting1234" (32 bytes) — dev only, set TWO_FACTOR_ENCRYPTION_KEY in prod
    encryption-key: ${TWO_FACTOR_ENCRYPTION_KEY:QXJhbnlhQ1JNMkZBRGV2S2V5Rm9yVGVzdGluZzEyMzQ=}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aranya_crm}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:aranya_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:aranya_secret}

  jpa:
    show-sql: true

  liquibase:
    contexts: dev

logging:
  level:
    aranya.crm: DEBUG
    org.springframework.security: DEBUG

firebase:
  service-account-path: classpath:firebase-service-account-dev.json
  project-id: aranya-crm-dev
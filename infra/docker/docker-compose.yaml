# Docker Compose configuration for Aranya's PostgreSQL database
services:
  postgres:
    image: postgres:15
    container_name: aranya_crm_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: aranya_crm
      POSTGRES_USER: aranya_admin
      POSTGRES_PASSWORD: aranya_secret
      TZ: Asia/Singapore
    ports:
      - "5432:5432"
    volumes:
      - aranya_crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aranya_admin -d aranya_crm"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aranya_network

  admin-server:
    build:
      context: ../../admin-server
      dockerfile: Dockerfile
    container_name: aranya_crm_admin_dev
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - aranya_network

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: aranya_crm_backend_dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aranya_crm
      SPRING_DATASOURCE_USERNAME: aranya_admin
      SPRING_DATASOURCE_PASSWORD: aranya_secret
      FIREBASE_SERVICE_ACCOUNT_PATH: file:/run/secrets/firebase-service-account-dev.json
      SPRING_BOOT_ADMIN_URL: http://admin-server:9090
      TZ: Asia/Singapore
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ../../backend/src/main/resources/firebase-service-account-dev.json
        target: /run/secrets/firebase-service-account-dev.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      admin-server:
        condition: service_started
    networks:
      - aranya_network

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_DASHBOARD_DATA_MODE: api
        VITE_DATA_MODE: api
    container_name: aranya_crm_frontend_dev
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - aranya_network

  sonar-postgres:
    image: postgres:15
    container_name: aranya_crm_sonar_postgres_dev
    profiles: ["sonar"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aranya_network

  sonarqube:
    image: sonarqube:community
    container_name: aranya_crm_sonar_dev
    profiles: ["sonar"]
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
    depends_on:
      sonar-postgres:
        condition: service_healthy
    networks:
      - aranya_network

  sonar-scanner:
    image: maven:3.9-eclipse-temurin-17
    container_name: aranya_crm_sonar_scanner_dev
    profiles: ["sonar"]
    working_dir: /workspace
    volumes:
      - type: bind
        source: ../../backend
        target: /workspace
      - maven_cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SONAR_TOKEN: ${SONAR_TOKEN}
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    command:
      - mvn
      - clean
      - verify
      - sonar:sonar
      - -Dsonar.host.url=http://sonarqube:9000
      - -Dsonar.token=${SONAR_TOKEN}
    depends_on:
      sonarqube:
        condition: service_started
    networks:
      - aranya_network

volumes:
  aranya_crm_data:
  sonar_postgres_data:
  sonar_data:
  sonar_logs:
  maven_cache:

networks:
  aranya_network:
    driver: bridge
